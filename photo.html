<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>주리네컷</title>
  <link rel="icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="css/photo.css">
  <script type="module" src="js/photo.js"></script>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="assets/logo.png" alt="주리랑 로고">
      <p class="eyebrow" id="event-line"></p>
      <h1>주리네컷</h1>
    </header>
    <figure class="photo">
      <img id="photo" alt="주리네컷 사진">
      <p id="status">사진을 불러오는 중이에요…</p>
    </figure>
    <button id="save" disabled>사진 저장하기</button>

    <figure class="photo" id="clip-box">
      <video id="clip" controls muted loop playsinline autoplay hidden></video>
      <p id="clip-status">🎬 촬영 영상을 기다리는 중이에요…</p>
    </figure>
    <button id="save-clip" disabled>영상 저장하기</button>

    <p id="hint"></p>
  </main>
</body>
</html>
