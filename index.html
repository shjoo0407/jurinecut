<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="주리네컷">
  <meta name="theme-color" content="#0f0f14">
  <title>주리네컷</title>
  <link rel="icon" href="assets/icon-180.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/booth.css">
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/booth.js"></script>
</head>
<body>
  <section class="screen" id="screen-device">
    <h2>어떤 기기로 찍나요?</h2>
    <p class="sub">고른 기기에 맞게 화면을 맞춰 드려요</p>
    <div class="choices">
      <button class="card device-card" data-action="pick-device" data-id="phone">
        <svg viewBox="0 0 64 100" aria-hidden="true"><rect x="6" y="4" width="52" height="92" rx="10"/><line x1="26" y1="85" x2="38" y2="85"/></svg>
        <strong>휴대폰</strong>
        <span>내 휴대폰으로 찍고<br>바로 저장해요</span>
      </button>
      <button class="card device-card" data-action="pick-device" data-id="tablet">
        <svg viewBox="0 0 140 100" aria-hidden="true"><rect x="4" y="12" width="132" height="76" rx="10"/><circle cx="123" cy="50" r="3"/></svg>
        <strong>아이패드</strong>
        <span>포토부스로 세워 두고<br>QR로 나눠줘요</span>
      </button>
    </div>
  </section>

  <section class="screen" id="screen-start" data-action="start">
    <button class="corner-link" data-action="change-device">기기 바꾸기</button>
    <img class="logo" src="assets/logo.png" alt="주리랑 로고">
    <p class="eyebrow" id="event-line"></p>
    <h1 class="title">주리네컷</h1>
    <p class="tap-hint">화면을 터치해서 시작하세요</p>
    <p class="status-line" id="status-line"></p>
  </section>

  <section class="screen" id="screen-layout">
    <h2>사진 구성을 골라주세요</h2>
    <div class="choices" id="layout-choices"></div>
    <nav class="actions">
      <button class="btn" data-action="home">처음으로</button>
    </nav>
  </section>

  <section class="screen" id="screen-shoot">
    <div class="viewfinder">
      <video id="video" autoplay muted playsinline></video>
      <div id="countdown"></div>
      <div id="flash"></div>
    </div>
    <aside class="shoot-panel">
      <p id="shot-counter"></p>
      <div class="slots" id="shot-slots"></div>
      <div id="shoot-idle">
        <button class="btn primary" data-action="shoot-start">촬영 시작</button>
        <button class="btn" data-action="back-layout">이전</button>
      </div>
    </aside>
  </section>

  <section class="screen" id="screen-review">
    <h2>이 사진으로 할까요?</h2>
    <div id="review-preview"></div>
    <nav class="actions">
      <button class="btn" data-action="retake">다시 찍기</button>
      <button class="btn primary" data-action="save">이대로 저장</button>
    </nav>
  </section>

  <section class="screen" id="screen-qr">
    <img id="qr-photo" alt="">
    <div class="qr-panel" id="qr-panel">
      <h2>사진 받아가세요!</h2>
      <div class="qr-box">
        <img id="qr-code" alt="사진 받기 QR 코드">
        <div class="spinner"></div>
      </div>
      <p id="qr-message"></p>
      <p id="qr-video"></p>
      <button class="btn" id="qr-home" data-action="home">처음으로</button>
    </div>
  </section>

  <!-- 휴대폰 모드의 마지막 화면: QR 대신 바로 저장 -->
  <section class="screen" id="screen-done">
    <img id="done-photo" alt="완성된 주리네컷 사진">
    <div class="done-panel">
      <h2>완성됐어요!</h2>
      <button class="btn primary" data-action="save-photo">사진 저장하기</button>
      <button class="btn" id="save-clip" data-action="save-clip" disabled></button>
      <p id="done-hint"></p>
      <button class="btn ghost" data-action="home">처음으로</button>
    </div>
  </section>

  <div id="toast" role="status"></div>
</body>
</html>
